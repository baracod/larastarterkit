
services:
  # 🐘 PHP-FPM + Laravel
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        user: laravel
        uid: 1000 # À ajuster si tu es sur Linux (id -u)
    container_name: starter_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    networks:
      - starter_net

  # 🌐 Nginx
  nginx:
    image: nginx:alpine
    container_name: starter_nginx
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    labels:
      caddy: "starter.local" # Votre nom de domaine ici
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.tls: "internal"
    networks:
      - starter_net
      - reverseproxy_caddy

  # 🗄️ Database (MariaDB)
  db:
    image: mariadb:10.11
    container_name: starter_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - starter_net

  # ... autres services (db, redis, etc.) ...

  # 🐬 phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: starter_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-laravel}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      # Cette variable aide, mais le fichier .ini est plus sûr pour le temps d'exécution
      UPLOAD_LIMIT: 2G
    ports:
      - "8080:80"
    volumes:
      # Injection de la config PHP personnalisée
      - ./docker/phpmyadmin/php-upload.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - db
    labels:
      caddy: "db.starter.local" # Votre nom de domaine ici
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - starter_net

  # ⚡ Redis (Cache/Queue)
  redis:
    image: redis:alpine
    container_name: starter_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - starter_net

  # 🎨 Frontend (Node + Vite)
  frontend:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: starter_frontend
    restart: unless-stopped
    working_dir: /var/www/html
    # Polling est nécessaire sur Windows/Mac pour détecter les changements de fichiers
    command: sh -c "pnpm install && pnpm run dev --host 0.0.0.0"
    volumes:
      - ./:/var/www/html
      # On évite d'écraser le node_modules du conteneur par celui de l'hôte s'ils diffèrent
      # - /var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - starter_net

networks:
  starter_net:
    driver: bridge
  reverseproxy_caddy:
    external: true
volumes:
  db_data:
