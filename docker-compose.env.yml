# Production avec un fichier env par service. Reconstruire l'image Laravel
# pour disposer du mode STARTER_SECRETS_SOURCE=environment.
x-app: &app
  image: ${STARTER_APP_IMAGE:?Set STARTER_APP_IMAGE in compose.env}
  build:
    context: .
    dockerfile: docker/prod/php/Dockerfile.prod
  init: true
  restart: unless-stopped
  env_file: ${STARTER_ENV_DIR:-./docker/env}/app.env
  volumes: [storage_data:/var/www/html/storage]
  networks: [internal]
  stop_grace_period: 300s
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *app
    restart: 'no'
    env_file: ${STARTER_ENV_DIR:-./docker/env}/maintenance.env
    entrypoint: [starter-maintenance]
    command: [migrate]
  app:
    <<: *app
    networks: [internal, egress]
    expose: ['80']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  worker:
    <<: *app
    env_file: ${STARTER_ENV_DIR:-./docker/env}/worker.env
    user: www-data
    stop_signal: SIGTERM
    command: [php, artisan, horizon, --no-interaction]
    networks: [internal, egress]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, artisan, horizon:status, --no-interaction]
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    <<: *app
    env_file: ${STARTER_ENV_DIR:-./docker/env}/scheduler.env
    user: www-data
    stop_signal: SIGTERM
    command: [php, artisan, schedule:work, --no-interaction]
    depends_on:
      app:
        condition: service_healthy
  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file: ${STARTER_ENV_DIR:-./docker/env}/db.env
    volumes: [db_data:/var/lib/mysql]
    networks: [internal]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file: ${STARTER_ENV_DIR:-./docker/env}/redis.env
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"']
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    profiles: [standalone]
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ${STARTER_ENV_DIR:-./docker/env}/gateway.env
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, egress]
    depends_on:
      app:
        condition: service_healthy

networks:
  internal:
    internal: true
  egress: {}
volumes:
  storage_data: {}
  db_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
