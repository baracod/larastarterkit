server {
    listen 80;
    server_name _;
    root /srv/storage/app/documentation/site/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location = /healthz { return 200 "ok\n"; }
    location = / { return 302 /docs/; }
    location = /docs { return 302 /docs/; }
    location /docs/ {
        alias /srv/storage/app/documentation/site/current/;
        index index.html;
    }
    location / { return 404; }
}
